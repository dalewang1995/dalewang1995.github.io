<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 编码/解码 - 汪小鱼</title>
  <meta name="description" content="在线URL编码解码工具 - 支持encodeURIComponent和decodeURIComponent，免费、快速、无需注册。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://coderw.cn/url-translate.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <meta property="og:title" content="URL 编码/解码 - 汪小鱼">
  <meta property="og:description" content="在线URL编码解码工具，支持encodeURIComponent和decodeURIComponent。">
  <meta property="og:url" content="https://coderw.cn/url-translate.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CoderWang">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="URL 编码/解码 - 汪小鱼">
  <meta name="twitter:description" content="在线URL编码解码工具，免费、快速。">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "URL 编码/解码",
    "url": "https://coderw.cn/url-translate.html",
    "applicationCategory": "UtilityApplication",
    "browserRequirements": "Requires JavaScript"
  }
  </script>

  <script>
    (function(){
      var t=localStorage.getItem('theme');
      if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary:  '#4a6cf7',
            dark:     '#1a1a2e',
            surface:  '#f0f2f5',
          },
          fontFamily: {
            sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'monospace'],
          },
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script src="assets/i18n.js"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-surface dark:bg-slate-900 font-sans min-h-screen antialiased text-gray-800 dark:text-slate-200 transition-colors">

  <div x-data="urlTool" class="h-screen flex flex-col overflow-hidden page-enter">

    <!-- ===== NAV BAR ===== -->
    <nav class="bg-white dark:bg-slate-800 border-b border-gray-100 dark:border-slate-700">
      <div class="max-w-4xl mx-auto px-6 py-3 flex items-center justify-between">
        <a href="index.html" class="text-sm text-gray-400 dark:text-slate-500 hover:text-primary dark:hover:text-primary transition-colors flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span x-text="$store.i18n.t('back_home')"></span>
        </a>
        <h1 class="text-lg font-semibold text-gray-800 dark:text-white" x-text="$store.i18n.t('url_tool_title')"></h1>
        <div class="flex items-center gap-2">
          <button @click="$store.theme.toggle()" class="toggle-btn !border-gray-200 dark:!border-slate-600 !text-gray-400 dark:!text-slate-400 hover:!text-gray-600 dark:hover:!text-slate-200" :title="$store.theme.dark ? '切换到亮色模式' : '切换到暗色模式'">
            <svg x-show="!$store.theme.dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg x-show="$store.theme.dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </button>
          <button @click="$store.i18n.toggle()" class="toggle-btn !border-gray-200 dark:!border-slate-600 !text-gray-400 dark:!text-slate-400 text-xs font-semibold hover:!text-gray-600 dark:hover:!text-slate-200"
                  x-text="$store.i18n.locale === 'zh-CN' ? 'EN' : '中'"></button>
        </div>
      </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-8 overflow-y-auto">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Input -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-5 card-lift flex flex-col">
          <label class="text-xs font-semibold text-gray-400 dark:text-slate-500 uppercase tracking-wider mb-3"
                 x-text="$store.i18n.t('input_label')"></label>
          <textarea x-model="input"
                    :placeholder="$store.i18n.t('input_placeholder')"
                    class="flex-1 w-full min-h-[280px] p-4 text-sm border border-gray-200 dark:border-slate-600
                           rounded-lg bg-white dark:bg-slate-900 text-gray-800 dark:text-slate-200
                           focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
                           transition-shadow font-mono resize-none"></textarea>
          <div class="flex gap-3 mt-4">
            <button @click="encode"
                    class="flex-1 py-2.5 px-4 bg-primary text-white text-sm font-medium rounded-lg
                           hover:bg-primary/90 active:scale-[0.98] transition-all"
                    x-text="$store.i18n.t('btn_encode')"></button>
            <button @click="decode"
                    class="flex-1 py-2.5 px-4 bg-amber-500 text-white text-sm font-medium rounded-lg
                           hover:bg-amber-500/90 active:scale-[0.98] transition-all"
                    x-text="$store.i18n.t('btn_decode')"></button>
            <button @click="clear"
                    class="py-2.5 px-4 bg-gray-100 dark:bg-slate-700 text-gray-500 dark:text-slate-400
                           text-sm font-medium rounded-lg hover:bg-gray-200 dark:hover:bg-slate-600
                           active:scale-[0.98] transition-all"
                    x-text="$store.i18n.t('btn_clear')"></button>
          </div>
        </div>

        <!-- Output -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-5 card-lift flex flex-col">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-gray-400 dark:text-slate-500 uppercase tracking-wider"
                  x-text="$store.i18n.t('output_label')"></span>
            <button @click="copy" x-show="output"
                    class="text-xs text-primary hover:text-primary/80 transition-colors flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
              <span x-text="$store.i18n.t('btn_copy')"></span>
            </button>
          </div>
          <div class="flex-1 w-full min-h-[280px] p-4 text-sm border border-gray-200 dark:border-slate-600
                      rounded-lg bg-gray-50 dark:bg-slate-900 overflow-auto output-area font-mono
                      text-gray-800 dark:text-slate-200"
               :class="{ 'text-gray-300 dark:text-slate-600 italic': !output }"
               x-text="output || $store.i18n.t('output_placeholder')"></div>
          <p x-show="copied" x-transition class="text-xs text-green-500 mt-2 text-right" x-text="$store.i18n.t('copied')"></p>
        </div>

      </div>
    </main>

    <footer class="text-center text-xs text-gray-400 dark:text-slate-500 py-5">
      <p>&copy; <span x-text="year"></span> coderw.cn</p>
    </footer>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('urlTool', () => ({
        input: '',
        output: '',
        copied: false,
        year: new Date().getFullYear(),

        encode() {
          this.output = encodeURIComponent(this.input);
        },
        decode() {
          this.output = decodeURIComponent(this.input);
        },
        clear() {
          this.input = '';
          this.output = '';
        },
        copy() {
          if (!this.output) return;
          navigator.clipboard.writeText(this.output).then(() => {
            this.copied = true;
            setTimeout(() => { this.copied = false; }, 2000);
          });
        },
      }));
    });
  </script>

</body>
</html>
