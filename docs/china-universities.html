    var chartInstance = null;

    var currentMapName = 'china';     // 'china' or province adcode
    var currentProvince = null;       // province name when drilled down
    var currentMapData = null;        // data array for current map

    // Theme icons
    (function updateThemeIcons() {
      document.querySelector('.light-icon').style.display = isDark ? 'none' : '';
      document.querySelector('.dark-icon').style.display = isDark ? '' : 'none';
    })();

    // ===== Build map data =====
    var totalCount = 0;
    var mapData = [];
    var maxCount = 0;
    Object.keys(UNIVERSITY_DATA).forEach(function(name) {
      var count = UNIVERSITY_DATA[name].universities.length;
      totalCount += count;
      mapData.push({ name: name, value: count });
      if (count > maxCount) maxCount = count;
    });
    document.getElementById('totalBadge').textContent = totalCount;

    // ===== Build city-level map data for a province =====
    function buildCityMapData(provinceName) {
      var cityData = CITY_UNIVERSITY_DATA[provinceName];
      var result = [];
      if (!cityData) {
        // No detailed city data — put all universities as a single province-wide count
        var all = UNIVERSITY_DATA[provinceName];
        result.push({ name: provinceName, value: all ? all.universities.length : 0 });
      } else {
        Object.keys(cityData).forEach(function(code) {
          var c = cityData[code];
          result.push({ name: c.name, value: c.list.length, list: c.list });
        });
      }
      return result;
    }

    // ===== Create / update chart =====
    function createChart(mapName, mapDataArr, centerPoint) {
      var dom = document.getElementById('map-container');
      if (!dom) return;

      dom.style.width = window.innerWidth + 'px';
      dom.style.height = window.innerHeight + 'px';

      if (chartInstance && !chartInstance.isDisposed()) {
        chartInstance.dispose();
      }

      chartInstance = echarts.init(dom);

      var textColor = isDark ? '#94a3b8' : '#6b7280';
      var borderColor = isDark ? '#334155' : '#e5e7eb';
      var dataMax = 0;
      // Build reliable name→count lookup (not dependent on ECharts data matching)
      var nameCountMap = {};
      mapDataArr.forEach(function(d) { nameCountMap[d.name] = d.value; if (d.value > dataMax) dataMax = d.value; });

      // Helper: get count for any area name
      function getCount(name) {
        if (nameCountMap.hasOwnProperty(name)) return nameCountMap[name];
        // Fallback: search CITY_UNIVERSITY_DATA / UNIVERSITY_DATA
        if (currentProvince) {
          var cd = CITY_UNIVERSITY_DATA[currentProvince];
          if (cd) {
            for (var k in cd) { if (cd[k].name === name) return cd[k].list.length; }
          }
          var all = UNIVERSITY_DATA[currentProvince];
          if (all && name === currentProvince) return all.universities.length;
        }
        var ud = UNIVERSITY_DATA[name];
        if (ud) return ud.universities.length;
        return 0;
      }

      var isProvinceMap = mapName !== 'china' && mapDataArr.length > 1;

      var option = {
        backgroundColor: isDark ? '#0f172a' : '#f8fafc',
        tooltip: {
          trigger: 'item',
          backgroundColor: isDark ? 'rgba(15,23,42,0.95)' : 'rgba(255,255,255,0.95)',
          borderColor: borderColor,
          textStyle: { color: isDark ? '#e2e8f0' : '#1f2937', fontSize: 13 },
          formatter: function(p) {
            if (!p.name) return '';
            var count = getCount(p.name);
            return '<strong style="font-size:15px">' + p.name + '</strong><br/>'
              + '<span style="color:#4a6cf7;font-size:22px;font-weight:700">' + count + '</span>'
              + '<span style="font-size:12px"> 所本科院校</span>';
          }
        },
        visualMap: {
          min: 0,
          max: dataMax || 1,
          left: 16,
          bottom: 80,
          calculable: true,
          inRange: {
            color: isDark
              ? ['#1e3a5f', '#1e4d8c', '#2563eb', '#3b82f6', '#60a5fa']
              : ['#dbeafe', '#93c5fd', '#60a5fa', '#3b82f6', '#2563eb']
          },
          textStyle: { color: textColor, fontSize: 11 },
          itemWidth: 12,
          itemHeight: 100
        },
        series: [{
          type: 'map',
          map: mapName,
          roam: true,
          scaleLimit: { min: 1, max: 8 },
          center: centerPoint || (mapName === 'china' ? [105, 36] : undefined),
          zoom: mapName === 'china' ? 1.2 : undefined,
          itemStyle: {
            borderColor: isDark ? '#1e293b' : '#ffffff',
            borderWidth: 1.5,
            areaColor: isDark ? '#1e293b' : '#f1f5f9'
          },
          emphasis: {
            label: { show: true, color: '#fff', fontSize: 15, fontWeight: 'bold',
              textBorderColor: '#1e293b', textBorderWidth: 3,
              formatter: function(p) { var c = getCount(p.name); return c > 0 ? p.name + ' ' + c : p.name; }
            },
            itemStyle: { areaColor: '#fbbf24', borderColor: '#f59e0b', borderWidth: 2, shadowBlur: 20, shadowColor: 'rgba(251,191,36,0.3)' }
          },
          label: { show: true, color: textColor, fontSize: isProvinceMap ? 11 : 10, fontWeight: '500',
            textBorderColor: isDark ? '#0f172a' : '#fff', textBorderWidth: 2,
            formatter: mapName === 'china' ? '{b}' : function(p) { var c = getCount(p.name); return c > 0 ? p.name + ' ' + c : p.name; }
          },
          data: mapDataArr
        }]
      };

      // No visualMap for provinces with single entry (no city data)
      if (mapName !== 'china' && mapDataArr.length <= 1) {
        delete option.visualMap;
        option.series[0].zoom = 8;
      }

      chartInstance.setOption(option);

      chartInstance.off('click');
      chartInstance.on('click', function(params) {
        if (!params.name) return;

        if (mapName === 'china') {
          // National level: drill down to province
          if (UNIVERSITY_DATA[params.name]) {
            drillToProvince(params.name);
          }
        } else {
          // Province level: look up city data from our sources (not ECharts binding)
          var cityList = null;
          var provData = CITY_UNIVERSITY_DATA[currentProvince];
          if (provData) {
            for (var k in provData) {
              if (provData[k].name === params.name) { cityList = provData[k].list; break; }
            }
          }
          if (cityList && cityList.length > 0) {
            showCityDetail(params.name, cityList);
          } else if (cityList && cityList.length === 0) {
            showCityDetail(params.name, []);
          } else if (UNIVERSITY_DATA[currentProvince]) {
            showCityDetail(currentProvince, UNIVERSITY_DATA[currentProvince].universities);
          }
        }
      });

      currentMapName = mapName;
      currentMapData = mapDataArr;
    }

    // ===== Drill to province =====
    function drillToProvince(provinceName) {
      var adcode = ADCCODE_MAP[provinceName];
      if (!adcode) return;

      currentProvince = provinceName;

      // Update UI
      document.getElementById('backBtn').style.display = '';
      document.getElementById('currentViewLabel').textContent = provinceName;

      // Load province geo JSON on demand
      var geoUrl = 'https://geo.datav.aliyun.com/areas_v3/bound/' + adcode + '_full.json';
      fetch(geoUrl)
        .then(function(r) { return r.json(); })
        .then(function(geo) {
          var mapKey = 'province_' + adcode;
          echarts.registerMap(mapKey, geo);
          var cityData = buildCityMapData(provinceName);
          // DataV province geo features use specific center
          var center = geo.features && geo.features[0] && geo.features[0].properties && geo.features[0].properties.center;
          createChart(mapKey, cityData, center);
          updatePanelForProvince(provinceName);
        })
        .catch(function(e) {
          console.warn('Failed to load province geo: ' + e.message);
          updatePanelForProvince(provinceName);
        });
    }

    function backToNational() {
      currentProvince = null;
      currentMapName = 'china';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('currentViewLabel').textContent = '中国本科院校分布';
      createChart('china', mapData);
      resetPanel();
    }

    // ===== Panel helpers =====
    function updatePanelForProvince(name) {
      var data = UNIVERSITY_DATA[name];
      if (!data) return;
      document.getElementById('panelTitle').textContent = name + ' · 本科院校';
      document.getElementById('panelCount').textContent = data.universities.length;
      document.getElementById('panelProgress').style.width = (data.universities.length / totalCount * 100) + '%';
      document.getElementById('panelPercent').textContent = (data.universities.length / totalCount * 100).toFixed(1);
      document.getElementById('panelStats').style.display = '';
      document.getElementById('panelEmpty').style.display = 'none';

      // Build city-grouped list
      var cityData = CITY_UNIVERSITY_DATA[name];
      var html = '';
      if (cityData) {
        Object.keys(cityData).forEach(function(code) {
          var c = cityData[code];
          if (c.list.length === 0) return;
          html += '<div class="px-5 py-2 text-xs font-semibold text-gray-400 dark:text-slate-500 bg-gray-50/50 dark:bg-slate-800/50 border-b border-gray-100 dark:border-slate-700">' + c.name + '（' + c.list.length + '所）</div>';
          c.list.forEach(function(u, i) {
            html += '<div class="flex items-center gap-3 px-5 py-2.5 pl-8 border-b border-gray-50 dark:border-slate-700/50 hover:bg-gray-50 dark:hover:bg-slate-700/30 transition-colors">'
              + '<span class="w-5 h-5 rounded-full bg-primary/10 dark:bg-primary/20 text-primary text-xs font-semibold flex items-center justify-center shrink-0">' + (i + 1) + '</span>'
              + '<span class="text-sm text-gray-700 dark:text-slate-300">' + u + '</span></div>';
          });
        });
        // Add unclassified universities (not in city data) under a catch-all
        var classified = {};
        Object.keys(cityData).forEach(function(c) { cityData[c].list.forEach(function(u) { classified[u] = true; }); });
        var unclassified = data.universities.filter(function(u) { return !classified[u]; });
        if (unclassified.length > 0) {
          html += '<div class="px-5 py-2 text-xs font-semibold text-gray-400 dark:text-slate-500 bg-gray-50/50 dark:bg-slate-800/50 border-b border-gray-100 dark:border-slate-700">其他（' + unclassified.length + '所）</div>';
          unclassified.forEach(function(u, i) {
            html += '<div class="flex items-center gap-3 px-5 py-2.5 pl-8 border-b border-gray-50 dark:border-slate-700/50 hover:bg-gray-50 dark:hover:bg-slate-700/30 transition-colors">'
              + '<span class="text-sm text-gray-700 dark:text-slate-300">' + u + '</span></div>';
          });
        }
      } else {
        data.universities.forEach(function(u, i) {
          html += '<div class="flex items-center gap-3 px-5 py-3 border-b border-gray-50 dark:border-slate-700/50 hover:bg-gray-50 dark:hover:bg-slate-700/30 transition-colors">'
            + '<span class="w-6 h-6 rounded-full bg-primary/10 dark:bg-primary/20 text-primary text-xs font-semibold flex items-center justify-center shrink-0">' + (i + 1) + '</span>'
            + '<span class="text-sm text-gray-700 dark:text-slate-300">' + u + '</span></div>';
        });
      }
      document.getElementById('panelList').innerHTML = html;
      document.getElementById('panelList').style.display = '';
      document.getElementById('detailPanel').classList.add('open');
    }

    function showCityDetail(cityName, uniList) {
      document.getElementById('panelTitle').textContent = cityName + ' · 本科院校';
      document.getElementById('panelCount').textContent = uniList.length;
      document.getElementById('panelProgress').style.width = (uniList.length / totalCount * 100) + '%';
      document.getElementById('panelPercent').textContent = (uniList.length / totalCount * 100).toFixed(1);
      document.getElementById('panelStats').style.display = '';
      document.getElementById('panelEmpty').style.display = 'none';

      var html = '';
      if (uniList.length === 0) {
        html = '<div class="flex items-center justify-center py-16 text-sm text-gray-400 dark:text-slate-500">该区域暂无本科院校数据</div>';
      } else {
        uniList.forEach(function(u, i) {
          html += '<div class="flex items-center gap-3 px-5 py-3 border-b border-gray-50 dark:border-slate-700/50 hover:bg-gray-50 dark:hover:bg-slate-700/30 transition-colors">'
            + '<span class="w-6 h-6 rounded-full bg-primary/10 dark:bg-primary/20 text-primary text-xs font-semibold flex items-center justify-center shrink-0">' + (i + 1) + '</span>'
            + '<span class="text-sm text-gray-700 dark:text-slate-300">' + u + '</span></div>';
        });
      }
      document.getElementById('panelList').innerHTML = html;
      document.getElementById('panelList').style.display = '';
      document.getElementById('detailPanel').classList.add('open');
    }

    function resetPanel() {
      document.getElementById('panelTitle').textContent = '点击地图省份查看详情';
      document.getElementById('panelStats').style.display = 'none';
      document.getElementById('panelList').style.display = 'none';
      document.getElementById('panelEmpty').style.display = '';
    }

    function closePanel() {
      document.getElementById('detailPanel').classList.remove('open');
    }

    function toggleTheme() {
      isDark = !isDark;
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', isDark);
      document.querySelector('.light-icon').style.display = isDark ? 'none' : '';
      document.querySelector('.dark-icon').style.display = isDark ? '' : 'none';
      if (chartInstance && !chartInstance.isDisposed()) chartInstance.dispose();
      chartInstance = null;
      loadAndInit();
    }

    // Resize handler
    window.addEventListener('resize', function() {
      var dom = document.getElementById('map-container');
      if (dom) {
        dom.style.width = window.innerWidth + 'px';
        dom.style.height = window.innerHeight + 'px';
      }
      if (chartInstance && !chartInstance.isDisposed()) {
        chartInstance.resize();
      }
    });

    // ===== Load map & init =====
    function loadAndInit() {
      fetch('/100000_full.json')
        .then(function(r) { return r.json(); })
        .then(function(geo) {
          echarts.registerMap('china', geo);
        })
        .catch(function(e) {
          console.warn('Geo JSON load failed: ' + e.message);
        })
        .finally(function() {
          setTimeout(function() {
            currentMapName = 'china';
            currentProvince = null;
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('currentViewLabel').textContent = '中国本科院校分布';
            createChart('china', mapData);
            resetPanel();
          }, 200);
        });
    }

    loadAndInit();
  </script>

</body>
</html>
