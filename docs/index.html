            </svg>
            <!-- Moon icon -->
            <svg x-show="$store.theme.dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>

          <!-- Lang Toggle -->

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('home', () => ({
        betweenDays: 0,
        countdownPercent: 0,
        year: new Date().getFullYear(),
        titleAnimating: false,
        _titleBusy: false,

        init() {
          this.calcCountdown();
        },

        calcCountdown() {
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const year = today.getFullYear();
          const thisYearTarget = new Date(year, 1, 10);
          let target;
          if (today <= thisYearTarget) {
            target = thisYearTarget;
          } else {
            target = new Date(year + 1, 1, 10);
          }
          this.betweenDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
          const total = 365;
          const elapsed = total - this.betweenDays;
          this.countdownPercent = Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
        },

        triggerAnimation() {
          if (this._titleBusy) return;
          this._titleBusy = true;
          this.titleAnimating = false;
          this.$nextTick(() => {
            void this.$refs.titleEl.offsetHeight;
            this.titleAnimating = true;
          });
          setTimeout(() => {
            this._titleBusy = false;
            this.titleAnimating = false;
          }, 800);
        },
      }));
    });
  </script>
