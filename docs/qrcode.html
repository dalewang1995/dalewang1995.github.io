<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 转二维码 - 汪小鱼</title>
  <meta name="description" content="在线URL转二维码工具 - 输入链接或文本即可生成高清二维码，支持PNG下载，免费、快速、无需注册。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://coderw.cn/qrcode.html">
  <link rel="icon" href="favicon.ico">

  <meta property="og:title" content="URL 转二维码 - 汪小鱼">
  <meta property="og:description" content="在线URL转二维码工具，输入链接或文本即可生成高清二维码，支持PNG下载。">
  <meta property="og:url" content="https://coderw.cn/qrcode.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CoderWang">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="URL 转二维码 - 汪小鱼">
  <meta name="twitter:description" content="在线URL转二维码工具，支持PNG下载。">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "URL 转二维码",
    "url": "https://coderw.cn/qrcode.html",
    "applicationCategory": "UtilityApplication",
    "browserRequirements": "Requires JavaScript"
  }
  </script>

  <script>
    (function(){
      var t=localStorage.getItem('theme');
      if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary:  '#4a6cf7',
            dark:     '#1a1a2e',
            surface:  '#f0f2f5',
          },
          fontFamily: {
            sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'monospace'],
          },
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-surface dark:bg-slate-900 font-sans min-h-screen antialiased text-gray-800 dark:text-slate-200 transition-colors">

  <div x-data="qrTool" class="min-h-screen flex flex-col page-enter">

    <!-- ===== NAV BAR ===== -->
    <nav class="bg-white dark:bg-slate-800 border-b border-gray-100 dark:border-slate-700">
      <div class="max-w-2xl mx-auto px-6 py-3 flex items-center justify-between">
        <a href="index.html" class="text-sm text-gray-400 dark:text-slate-500 hover:text-primary dark:hover:text-primary transition-colors flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span x-text="$store.i18n.t('back_home')"></span>
        </a>
        <h1 class="text-lg font-semibold text-gray-800 dark:text-white" x-text="$store.i18n.t('qr_tool_title')"></h1>
        <div class="flex items-center gap-2">
          <button @click="$store.theme.toggle()" class="toggle-btn !border-gray-200 dark:!border-slate-600 !text-gray-400 dark:!text-slate-400 hover:!text-gray-600 dark:hover:!text-slate-200" :title="$store.theme.dark ? '切换到亮色模式' : '切换到暗色模式'">
            <svg x-show="!$store.theme.dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg x-show="$store.theme.dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </button>
          <button @click="$store.i18n.toggle()" class="toggle-btn !border-gray-200 dark:!border-slate-600 !text-gray-400 dark:!text-slate-400 text-xs font-semibold hover:!text-gray-600 dark:hover:!text-slate-200"
                  x-text="$store.i18n.locale === 'zh-CN' ? 'EN' : '中'"></button>
        </div>
      </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="flex-1 max-w-2xl mx-auto w-full px-4 py-8">
      <div class="space-y-6">

        <!-- Input Card -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-5 card-lift">
          <label class="text-xs font-semibold text-gray-400 dark:text-slate-500 uppercase tracking-wider mb-3 block"
                 x-text="$store.i18n.t('qr_input_label')"></label>
          <textarea x-model="text"
                    :placeholder="$store.i18n.t('qr_input_placeholder')"
                    class="w-full min-h-[160px] p-4 text-sm border border-gray-200 dark:border-slate-600
                           rounded-lg bg-white dark:bg-slate-900 text-gray-800 dark:text-slate-200
                           focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
                           transition-shadow font-mono resize-none"></textarea>
          <div class="flex gap-3 mt-4">
            <button @click="generate"
                    class="flex-1 py-2.5 px-4 bg-primary text-white text-sm font-medium rounded-lg
                           hover:bg-primary/90 active:scale-[0.98] transition-all disabled:opacity-50"
                    :disabled="!text.trim()"
                    x-text="$store.i18n.t('btn_generate')"></button>
            <button @click="clear"
                    class="py-2.5 px-4 bg-gray-100 dark:bg-slate-700 text-gray-500 dark:text-slate-400
                           text-sm font-medium rounded-lg hover:bg-gray-200 dark:hover:bg-slate-600
                           active:scale-[0.98] transition-all"
                    x-text="$store.i18n.t('btn_clear')"></button>
          </div>
        </div>

        <!-- QR Code Output Card -->
        <div x-show="generated" x-transition
             class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-8 card-lift text-center">
          <div id="qrcode-container" class="qrcode-wrapper inline-block mb-4"></div>
          <button @click="download"
                  class="inline-flex items-center gap-2 py-2 px-5 bg-gray-100 dark:bg-slate-700
                         text-gray-600 dark:text-slate-300 text-sm font-medium rounded-lg
                         hover:bg-gray-200 dark:hover:bg-slate-600 active:scale-[0.98] transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            <span x-text="$store.i18n.t('btn_download')"></span>
          </button>
        </div>

        <!-- Empty State -->
        <div x-show="!generated"
             class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-12 card-lift text-center">
          <div class="text-5xl mb-4">📱</div>
          <p class="text-gray-400 dark:text-slate-500 text-sm" x-text="$store.i18n.t('qr_empty')"></p>
        </div>

      </div>
    </main>

    <footer class="text-center text-xs text-gray-400 dark:text-slate-500 py-5">
      <p>&copy; <span x-text="year"></span> coderw.cn</p>
    </footer>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('qrTool', () => ({
        text: '',
        generated: false,
        year: new Date().getFullYear(),
        _qrInstance: null,

        generate() {
          if (!this.text.trim()) {
            alert(this.$store.i18n.t('qr_empty_warn'));
            return;
          }
          const container = document.getElementById('qrcode-container');
          container.innerHTML = '';
          if (typeof QRCode === 'undefined') {
            alert(this.$store.i18n.t('qr_loading_fail'));
            return;
          }
          this._qrInstance = new QRCode(container, {
            text: this.text.trim(),
            width: 280,
            height: 280,
            colorDark: '#1a1a2e',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H,
          });
          this.generated = true;
        },

        clear() {
          this.text = '';
          this.generated = false;
          const container = document.getElementById('qrcode-container');
          if (container) container.innerHTML = '';
          this._qrInstance = null;
        },

        download() {
          const container = document.getElementById('qrcode-container');
          const canvas = container.querySelector('canvas');
          if (!canvas) {
            const img = container.querySelector('img');
            if (img) {
              const a = document.createElement('a');
              a.href = img.src;
              a.download = 'qrcode.png';
              a.click();
              return;
            }
            alert(this.$store.i18n.t('download_fail'));
            return;
          }
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'qrcode.png';
          a.click();
        },
      }));
    });
  </script>

</body>
</html>
